<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>TrustPay AI - Shop smarter. Pay safer.</title>
  <meta name="description" content="TrustPay AI is an AI-assisted purchase review platform with human approval and PayPal sandbox checkout. Evaluate sellers, pricing, and policies before you pay."/>
  <meta name="theme-color" content="#0f1b2e"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="TrustPay AI - Shop smarter. Pay safer."/>
  <meta property="og:description" content="AI-assisted purchase review with human approval and PayPal sandbox checkout."/>
  <meta property="og:image" content="/og-image.svg"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="TrustPay AI - Shop smarter. Pay safer."/>

  <meta name="twitter:image" content="/og-image.svg"/>
  <script>
    try{
      var saved=localStorage.getItem('trustpay-theme');
      var theme=saved==='dark'||saved==='light'?saved:'dark';
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
    }catch{document.documentElement.dataset.theme='dark';document.documentElement.style.colorScheme='dark';}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
